name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cmake --version

      - name: Read whisper.cpp tag
        id: manifest
        run: echo "tag=$(node -p "require('./whisper.manifest.json').whisperCppTag")" >> "$GITHUB_OUTPUT"

      # Keyed on the whisper.cpp tag so a manifest bump invalidates the cache and rebuilds;
      # otherwise a cache hit skips the multi-minute cmake build entirely.
      - name: Cache compiled whisper binary
        uses: actions/cache@v4
        with:
          path: |
            resources/
            .cache/whisper.cpp
          key: ${{ runner.os }}-whisper-${{ steps.manifest.outputs.tag }}

      # Keyed on the model filename, not its contents, since fetch-test-model.mjs
      # already verifies the download against a pinned checksum.
      - name: Cache test model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: ${{ runner.os }}-model-ggml-tiny.bin

      - run: npm run setup
      - run: npm run test:integration
