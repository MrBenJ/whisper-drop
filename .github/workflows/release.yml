name: Release build

# Separate from ci.yml on purpose: different triggers, different runtimes, and
# a failure here means "no artifact", not "the code is broken".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Builds installers for all four targets, uploads each as a workflow artifact, and
# on a `v*` tag publishes them to a draft GitHub Release. This is safe now that the
# bundled ffmpeg/ffprobe are redistributable LGPL builds (no --enable-gpl/--enable-nonfree):
# the "Verify" step byte-scans every media binary for those flags and fails the job
# before anything is uploaded, so a non-redistributable binary can never leave the runner.
# The release job is the only one granted `contents: write`; the release is created as a
# draft so a human flips it live after the manual per-platform smoke check.
permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            slug: mac-arm64
            os: macos-latest
            arch: arm64
            platform: darwin
            builder: --mac --arm64
            artifacts: dist/*.dmg
          # Cross-built from the same arm64 runner: whisper.cpp via
          # CMAKE_OSX_ARCHITECTURES, Electron because electron-builder
          # downloads the x64 runtime it is asked for, and ffmpeg-static via
          # the "Install the ffmpeg-static binary" step below.
          - name: macOS x64
            slug: mac-x64
            os: macos-latest
            arch: x64
            platform: darwin
            builder: --mac --x64
            artifacts: dist/*.dmg
          - name: Windows x64
            slug: win-x64
            os: windows-latest
            arch: x64
            platform: win32
            builder: --win --x64
            artifacts: dist/*.exe
          - name: Linux x64
            slug: linux-x64
            os: ubuntu-latest
            arch: x64
            platform: linux
            builder: --linux --x64
            artifacts: |
              dist/*.AppImage
              dist/*.deb

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: cmake --version

      # The macOS x64 leg cross-compiles ffmpeg on an arm64 runner; x86 assembly
      # needs the nasm assembler, which isn't preinstalled. Harmless on the arm64
      # leg, which doesn't use it.
      - name: Install nasm for the ffmpeg build
        if: matrix.platform == 'darwin'
        run: brew install nasm

      - name: Read whisper.cpp tag
        id: manifest
        shell: bash
        run: echo "tag=$(node -p "require('./whisper.manifest.json').whisperCppTag")" >> "$GITHUB_OUTPUT"

      # macOS is compiled from the FFmpeg source tag; Windows/Linux come from a
      # named BtbN asset. Either uniquely identifies the ffmpeg being shipped, so
      # it belongs in the cache key alongside the whisper tag.
      - name: Read ffmpeg build id
        id: ffmpeg
        shell: bash
        run: echo "id=$(node -p "const m=require('./ffmpeg.manifest.json'); process.env.WD==='darwin'?m.ffmpegTag:m.btbn.assets[process.env.SLUG].filename")" >> "$GITHUB_OUTPUT"
        env:
          WD: ${{ matrix.platform }}
          SLUG: ${{ matrix.platform }}-${{ matrix.arch }}

      # Same convention as ci.yml's integration and e2e jobs, plus the arch:
      # both macOS jobs run on the same runner.os and build different binaries
      # into the same `resources/` path, so the tag alone would collide. For
      # the Linux x64 leg specifically this key is identical to ci.yml's
      # `${{ runner.os }}-whisper-<tag>-x64` — deliberate, so a push that
      # already primed CI's cache doesn't pay to rebuild whisper.cpp again here.
      # One cache covers both provisioned tools: they share resources/ as their
      # output, so a single key keyed on BOTH ids avoids two caches racing to
      # populate the same directory. A bump to either manifest busts it.
      - name: Cache provisioned whisper + ffmpeg binaries
        uses: actions/cache@v4
        with:
          path: |
            resources/
            .cache/whisper.cpp
            .cache/ffmpeg
          key: ${{ runner.os }}-whisper-${{ steps.manifest.outputs.tag }}-${{ matrix.arch }}-ffmpeg-${{ steps.ffmpeg.outputs.id }}

      # npm run setup builds whisper.cpp and provisions ffmpeg/ffprobe for the
      # target arch; each step no-ops when its stamp already matches (cache hit).
      - name: Build whisper.cpp and provision ffmpeg for ${{ matrix.arch }}
        run: npm run setup
        env:
          WHISPER_DROP_TARGET_ARCH: ${{ matrix.arch }}

      # electron-builder only warns when an extraResources source is missing,
      # which would ship an installer that cannot transcribe. Fail here
      # instead — for whisper-cli (existence only; npm run setup always
      # compiles for the arch it's asked for) and for ffmpeg-static
      # (existence *and* architecture, since its binary is downloaded, not
      # compiled, and the previous step's reinstall is what this proves
      # actually worked).
      - name: Verify the platform-matched whisper-cli, ffmpeg and ffprobe exist
        shell: bash
        run: node scripts/verify-release-binaries.mjs
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}

      - run: npm run build

      - name: Package
        shell: bash
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          # Belt and braces alongside `mac.identity: null`: never pick up a
          # Developer ID that happens to be on the machine.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Safe to upload: the "Verify" step above byte-scanned every bundled ffmpeg/
      # ffprobe for --enable-gpl/--enable-nonfree and failed the job before reaching
      # here if any were present, so only redistributable LGPL binaries can be uploaded.
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-drop-${{ matrix.slug }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  # Publish a GitHub Release on `v*` tags only, from the artifacts the package job
  # verified and uploaded. Created as a draft: a human runs the per-platform smoke
  # check (README "Manual smoke check before release"), then publishes it.
  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the draft release with all platform assets
        # Third-party action pinned to a full commit SHA (v2.0.5) rather than a
        # mutable tag: this job holds contents:write, so its supply chain matters.
        uses: softprops/action-gh-release@69320dbe05506a9a39fc8ae11030b214ec2d1f87
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: true
